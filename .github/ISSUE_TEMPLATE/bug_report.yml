name: Bug report
description: Create a report to help us improve
title: "[BUG] <Short description>"
labels: [bug]
body:
- type: textarea
  id: description
  attributes:
    label: Describe the bug
    description: >-
      A clear and concise description of what the bug is.
    placeholder: 'Example: the game crashes when I open a chest on 1.20.4'
  validations:
    required: true

- type: textarea
  attributes:
    label: The log file and images/videos
    description: |
      The log file `latestlog.txt` is located under `/storage/emulated/0/Android/data/me.shadow.eclipselauncher/files` (on Android 10 and higher) or `/storage/emulated/0/games/EclipseLauncher/` (on Android 9 and lower). You may have to activate an option in your file explorer to see hidden files and folders. Recommended file managers are ZArcher and MiXplorer.

      You can also attach here screenshots or videos of the buggy behavior, if possible.

      Tip: You can attach files by clicking this area to highlight it and then dragging files in, or select them using the 🖼 option at the top right.
    validations:
      required: true

- type: textarea
  attributes:
    label: To Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. Go to '...'
      2. Click on '...'
      3. Scroll down to '...'
      4. See error
  validations:
    required: true

- type: input
  id: launcher-version
  attributes:
    label: Eclipse Launcher version
    description: "Settings → About. Example: `1.0 (eclipse-20261002-abc1234-main)`"
    placeholder: "1.0"
  validations:
    required: true

- type: input
  id: device
  attributes:
    label: Device
    description: Manufacturer and model.
    placeholder: "e.g. Samsung Galaxy S23"
  validations:
    required: true

- type: input
  id: android-version
  attributes:
    label: Android version
    placeholder: "e.g. Android 14"
  validations:
    required: true

- type: dropdown
  id: renderer
  attributes:
    label: Renderer
    options:
      - GL4ES (all versions, fast)
      - Zink (Vulkan)
      - LTW (OpenGL ES 3)
      - Not sure
  validations:
    required: false

- type: textarea
  attributes:
    label: Additional context
    description: Anything else that might help us triage the issue.
  validations:
    required: false
