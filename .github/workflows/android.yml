name: Build

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Builds are published to GitHub Releases, never to Actions artifacts.
#   push a tag (v1.0)  -> a Release for that tag
#   push to main       -> the rolling `nightly` prerelease
permissions:
  contents: write

env:
  APP_MODULE: app_eclipselauncher

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # getVersionName() runs `git describe --tags`
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Eclipse native stack comes from our own releases, not another team's.
      # libeclipseexec.so is only reachable through this AAR, and ctxbridges/ binds to it
      # with dlopen at run time - so a missing download would still produce a green build
      # that quietly does nothing. Fail the job here instead of shipping that.
      - name: Fetch Eclipse native stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ${{ env.APP_MODULE }}/libs
          gh release download v0.1.0 \
            --repo ShadowMaybe/eclipseexec \
            --pattern 'eclipseexec-v0.1.0.aar' \
            --dir ${{ env.APP_MODULE }}/libs
          test -s ${{ env.APP_MODULE }}/libs/eclipseexec-v0.1.0.aar
          echo "eclipseexec AAR present:"
          ls -la ${{ env.APP_MODULE }}/libs

      # LTW has no releases, only 90-day Actions artifacts, so we build it from a pinned
      # source ref rather than depending on another team's artifacts.
      #
      # MojoLauncher/LTW (LGPL-3.0) is required over the previously used archived upstream
      # revision: its translator kept uniform-block dedup in a process-global table of
      # pointers that were freed after every conversion, compared by address not by name.
      # Depending on allocation order a block was either dropped or emitted twice, which is
      # what produced the 1.21.6+ core-profile failures:
      #   'DynamicTransforms' : redefinition  +  UBO/SSBO symbol creation failed
      #   'ProjMat'/'ColorModulator'/'FogColor' : undeclared
      # Mojo fixed that table (4ad1b874) and adds the 1.21.11 timer-query fix (PR #12).
      - name: Checkout LTW renderer source
        uses: actions/checkout@v4
        with:
          repository: MojoLauncher/LTW
          ref: 11f1b36f701e69731d685e94c6788e60d829ea35
          path: ltw-src

      - name: Build LTW renderer
        run: |
          set -euo pipefail
          chmod +x ltw-src/gradlew
          (cd ltw-src && ./gradlew :ltw:assembleRelease --no-daemon)
          test -s ltw-src/ltw/build/outputs/aar/ltw-release.aar
          mkdir -p ${{ env.APP_MODULE }}/libs
          cp ltw-src/ltw/build/outputs/aar/ltw-release.aar ${{ env.APP_MODULE }}/libs/
          echo "LTW AAR present:"
          ls -la ${{ env.APP_MODULE }}/libs

      # JREs come from our own release, not from another team's Actions artifacts.
      - name: Fetch JRE bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ${{ env.APP_MODULE }}/src/main/assets/components/{jre,jre-new,jre-21,jre-25}
          gh release download jres-v1.0.0 \
            --repo ShadowMaybe/JRE-Builds-Android \
            --pattern 'jre8-android-multiarch.zip' \
            --pattern 'jre17-android-multiarch.zip' \
            --pattern 'jre21-android-multiarch.zip' \
            --pattern 'jre25-android-multiarch.zip'
          unzip -q jre8-android-multiarch.zip  -d ${{ env.APP_MODULE }}/src/main/assets/components/jre
          unzip -q jre17-android-multiarch.zip -d ${{ env.APP_MODULE }}/src/main/assets/components/jre-new
          unzip -q jre21-android-multiarch.zip -d ${{ env.APP_MODULE }}/src/main/assets/components/jre-21
          unzip -q jre25-android-multiarch.zip -d ${{ env.APP_MODULE }}/src/main/assets/components/jre-25
          rm -f jre*-android-multiarch.zip
          ls -la ${{ env.APP_MODULE }}/src/main/assets/components/jre-25

      # LWJGL's own natives are built by us from pristine upstream 3.4.3 for
      # Android/bionic (ShadowMaybe/eclipselwjgl) rather than taken from
      # another team's output. That repository compiles the untouched LWJGL
      # tree with NDK clang via -Dgcc.prefix=ndk-, verifies every import
      # against the NDK's API-21 stub libraries, and publishes the result to
      # its lwjgl-nightly release - so a failure there fails this build instead
      # of silently shipping a stale binary.
      #
      # The committed .so under jniLibs/ are overwritten below. They remain in
      # the tree only as a fallback for a local build; CI never uses them, and
      # the per-file hash comparison proves it did not.
      - name: Fetch LWJGL natives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          gh release download lwjgl-nightly \
            --repo ShadowMaybe/eclipselwjgl \
            --pattern 'eclipselwjgl-natives.zip' \
            --dir "$stage"
          test -s "$stage/eclipselwjgl-natives.zip"
          unzip -q "$stage/eclipselwjgl-natives.zip" -d "$stage/tree"

          # Modules a supported version actually declares. nuklear and par are
          # deliberately left out: no version JSON names them, and their build
          # blocks in config/linux/build.xml are the only two of 43 with no
          # if:true binding guard, so they are produced as a side effect
          # rather than on request.
          modules='liblwjgl liblwjgl_opengl liblwjgl_stb liblwjgl_tinyfd liblwjgl_vma'
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            src="$stage/tree/$abi"
            dst="${{ env.APP_MODULE }}/src/main/jniLibs/$abi"
            if [ ! -d "$src" ]; then
              echo "::error::release has no $abi/ directory"
              ls -la "$stage/tree"
              exit 1
            fi
            for m in $modules; do
              if [ ! -s "$src/$m.so" ]; then
                echo "::error::release is missing $m.so for $abi"
                ls -la "$src"
                exit 1
              fi
              cp "$src/$m.so" "$dst/$m.so"
              # Identity, not merely presence. The file that reaches the APK
              # must be byte-for-byte the one our release produced; a copy
              # aimed at the wrong directory would otherwise leave the
              # committed foreign binary in place and still go green.
              #
              # This deliberately does not use .comment as a compiler marker.
              # An earlier version of this step asserted the replacement by
              # grepping .comment for 'clang'. It failed with:
              #
              #   readelf: Warning: Section '.comment' was not dumped
              #            because it does not exist
              #
              # because llvm-strip drops .comment while the committed GCC 4.9
              # binaries kept it - so the marker was missing exactly from the
              # files we build and present on the ones we were replacing.
              if [ "$(sha256sum "$dst/$m.so" | awk '{print $1}')" != \
                   "$(sha256sum "$src/$m.so" | awk '{print $1}')" ]; then
                echo "::error::$abi/$m.so is not the file from our release"
                sha256sum "$dst/$m.so" "$src/$m.so"
                exit 1
              fi
            done
          done

          echo "LWJGL natives from ShadowMaybe/eclipselwjgl @ lwjgl-nightly:"
          ls -la "${{ env.APP_MODULE }}/src/main/jniLibs/arm64-v8a/"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      # Minecraft 26.2 adds shaderc, spvc, vulkan and vma to its module list.
      # MinecraftDownloader skips every org.lwjgl coordinate because the launcher
      # supplies those classes itself, so a missing jar here does not surface as a
      # download failure but as the game dying with
      #   NoClassDefFoundError: org.lwjgl.vulkan.VkPhysicalDeviceProperties2 (#373)
      #
      # Fetched instead of committed: 8.85 MiB, almost all of it the Vulkan jar.
      # A released Maven Central coordinate is immutable, so 3.4.3 always resolves
      # to the same bytes our other libs/*.jar already are - and the -f plus a full
      # zip integrity test rejects an HTML error page rather than packaging it.
      - name: Fetch LWJGL 26.2 module jars
        run: |
          set -euo pipefail
          libs="jre_lwjgl3glfw/libs"
          test -d "$libs" || { echo "::error::no such module dir: $libs"; exit 1; }
          base="https://repo1.maven.org/maven2/org/lwjgl"
          for a in lwjgl-vulkan lwjgl-shaderc lwjgl-spvc lwjgl-vma; do
            out="$libs/$a.jar"
            curl -fsSL --retry 3 --max-time 240 "$base/$a/3.4.3/$a-3.4.3.jar" -o "$out"
            if ! unzip -tq "$out" >/dev/null; then
              echo "::error::$out is not a readable jar"
              exit 1
            fi
            echo "  $(basename "$out") $(stat -c%s "$out") bytes"
          done

      - name: Build LWJGL component jar
        run: gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Build the launcher
        env:
          # Optional: add these repository secrets to sign with your own key.
          # Without them the build falls back to the committed debug keystore.
          ECLIPSE_KEYSTORE_PASSWORD: ${{ secrets.ECLIPSE_KEYSTORE_PASSWORD }}
          ECLIPSE_KEY_ALIAS: ${{ secrets.ECLIPSE_KEY_ALIAS }}
          ECLIPSE_KEY_PASSWORD: ${{ secrets.ECLIPSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :${{ env.APP_MODULE }}:assembleRelease --no-daemon
          mkdir -p out
          cp ${{ env.APP_MODULE }}/build/outputs/apk/release/${{ env.APP_MODULE }}-release.apk \
             out/Eclipse-Launcher.apk || \
          cp ${{ env.APP_MODULE }}/build/outputs/apk/release/${{ env.APP_MODULE }}-release-unsigned.apk \
             out/Eclipse-Launcher.apk
          (cd out && sha256sum Eclipse-Launcher.apk > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt

      - name: Publish to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=""
          else
            TAG="nightly"
            PRERELEASE="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/Eclipse-Launcher.apk out/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" out/Eclipse-Launcher.apk out/SHA256SUMS.txt \
              $PRERELEASE \
              --title "Eclipse Launcher $TAG" \
              --notes "Automated build of $TAG from ${GITHUB_SHA}."
          fi
          echo "Published:"
          gh release view "$TAG" --json assets -q '.assets[].name'
