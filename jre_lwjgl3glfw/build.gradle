plugins {
    id 'java'
}

group = 'org.lwjgl.glfw'

configurations.default.setCanBeResolved(true)

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = "lwjgl-glfw-classes"
    destinationDirectory.set(file("../app_eclipselauncher/src/main/assets/components/lwjgl3/"))
    if (gitUsed()){
      File versionFile = file("../app_eclipselauncher/src/main/assets/components/lwjgl3/version")
      // The containing directory holds the jar this task generates and is
      // gitignored, so on a fresh checkout it does not exist at all - git
      // does not materialise empty directories. This block runs during
      // configuration, before jar has created destinationDirectory, and
      // File.write does not create parent directories, so the first gradle
      // invocation of a clean clone dies with:
      //
      //   .../src/main/assets/components/lwjgl3/version
      //   (No such file or directory)
      //
      // It only ever appeared to work while the generated files were still
      // tracked in the repository.
      versionFile.parentFile.mkdirs()
      versionFile.write(getGitHash(project.name))
    }
    from {
        configurations.default.collect {
            println(it.getName())
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
